[package]
name = "novastrap"
version = "0.1.0"
description = "Novastrap: a launcher and manager for the Roblox desktop client"
authors = ["Novastrap contributors"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (cargo#8519).
name = "novastrap_lib"
crate-type = ["rlib"] # desktop-only; add "staticlib", "cdylib" if mobile targets are ever added

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
base64 = "0.22"
tokio = { version = "1", features = ["time"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
novastrap-core = { path = "../core" }



[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
